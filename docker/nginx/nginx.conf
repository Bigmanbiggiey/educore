user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"host":"$host","request":"$request","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"correlation_id":"$http_x_correlation_id"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Coarse first line of rate limiting ahead of DRF's own throttles
    # (docs/api-design.md §13).
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    client_max_body_size 25m;

    include /etc/nginx/conf.d/*.conf;
}
