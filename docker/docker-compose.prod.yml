services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped
    deploy:
      replicas: 2

  celery-worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped

  celery-beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped

  frontend:
    restart: unless-stopped

  nginx:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
