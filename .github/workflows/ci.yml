name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: educore
          POSTGRES_PASSWORD: educore
          POSTGRES_DB: educore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U educore" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-test-key
      DATABASE_URL: postgres://educore:educore@localhost:5432/educore
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Layer boundary check (import-linter)
        run: lint-imports
      - name: Tests
        run: |
          pytest || [ $? -eq 5 ]  # exit 5 = no tests collected yet, expected pre-Phase-1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint, includes boundary rules)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t educore-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t educore-frontend:ci ./frontend
