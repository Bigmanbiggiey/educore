<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; font-size: 12px; color: #1a1a1a; }
  h1 { font-size: 18px; margin-bottom: 0; }
  .meta { color: #555; margin-bottom: 1.5em; }
  .meta div { margin: 2px 0; }
  pre { background: #f5f5f5; padding: 1em; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
  <h1>{{ student.first_name }} {{ student.last_name }}</h1>
  <div class="meta">
    <div>Admission number: {{ student.admission_number }}</div>
    <div>Term: {{ term_id }}</div>
    <div>Fee balance: {{ balance }}</div>
  </div>
  <pre>{{ data_json }}</pre>
</body>
</html>
